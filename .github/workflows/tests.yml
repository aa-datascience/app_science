# Tests à chaque push : aucun appel réseau ni appel au modèle, donc aucun secret nécessaire.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "./pipeline[dev]"
      - name: Pipeline (pytest)
        working-directory: pipeline
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vérification des citations côté Edge Function
        run: node --test supabase/functions/open-paper/citations.test.ts supabase/functions/open-paper/figures.test.ts
      - name: App (types et logique)
        working-directory: app
        run: npm ci && npm run typecheck && npm test
