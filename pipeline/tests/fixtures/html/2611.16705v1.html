" class="ltx_Math" display="inline" id="S1.F1.m24" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>REF</mi></msub><mo>=</mo><mrow><mn>0</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{REF}}=0\ \text{V}</annotation></semantics></math> and <math alttext="V_{\mathrm{SD}}=0\ \text{V}" class="ltx_Math" display="inline" id="S1.F1.m25" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>SD</mi></msub><mo>=</mo><mrow><mn>0</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{SD}}=0\ \text{V}</annotation></semantics></math>. <span class="ltx_text ltx_font_bold" id="S1.F1.12">(<span class="ltx_text" id="S1.F1.12.1">e</span>)</span> Differential conductance as a function of the gate voltage <math alttext="V_{\mathrm{G}}" class="ltx_Math" display="inline" id="S1.F1.m26" intent=":literal"><semantics><msub><mi>V</mi><mi>G</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{G}}</annotation></semantics></math> and source-drain bias <math alttext="V_{\mathrm{SD}}" class="ltx_Math" display="inline" id="S1.F1.m27" intent=":literal"><semantics><msub><mi>V</mi><mi>SD</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{SD}}</annotation></semantics></math> of the SQPC at <math alttext="T=7\ \text{mK}" class="ltx_Math" display="inline" id="S1.F1.m28" intent=":literal"><semantics><mrow><mi>T</mi><mo>=</mo><mrow><mn>7</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>mK</mtext></mrow></mrow><annotation encoding="application/x-tex">T=7\ \text{mK}</annotation></semantics></math> and <math alttext="V_{\mathrm{REF}}=0\ \text{V}" class="ltx_Math" display="inline" id="S1.F1.m29" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>REF</mi></msub><mo>=</mo><mrow><mn>0</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{REF}}=0\ \text{V}</annotation></semantics></math>. <span class="ltx_text ltx_font_bold" id="S1.F1.13">(<span class="ltx_text" id="S1.F1.13.1">f</span>)</span> Differential resistance of the reference junction as a function of bias current <math alttext="I_{\mathrm{SD}}" class="ltx_Math" display="inline" id="S1.F1.m30" intent=":literal"><semantics><msub><mi>I</mi><mi>SD</mi></msub><annotation encoding="application/x-tex">I_{\mathrm{SD}}</annotation></semantics></math> and gate voltage <math alttext="V_{\mathrm{REF}}" class="ltx_Math" display="inline" id="S1.F1.m31" intent=":literal"><semantics><msub><mi>V</mi><mi>REF</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{REF}}</annotation></semantics></math> at <math alttext="V_{\mathrm{G}}=0\ \text{V}" class="ltx_Math" display="inline" id="S1.F1.m32" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mn>0</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=0\ \text{V}</annotation></semantics></math>.</figcaption>

<figure class="ltx_figure" id="S2.F2"><img alt="Refer to caption" class="ltx_graphics ltx_centering ltx_img_square" height="448" id="S2.F2.g1" src="2611.16705v1/Fig2.png" style="aspect-ratio:476/448;" width="476"/>
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 2: </span>Multiple Andreev reflection of the SQPC of the device A.
<span class="ltx_text ltx_font_bold" id="S2.F2.6">(<span class="ltx_text" id="S2.F2.6.1">a</span>)</span> Differential conductance of the SQPC at the onset of the first conductance plateau of the SQPC.
<span class="ltx_text ltx_font_bold" id="S2.F2.7">(<span class="ltx_text" id="S2.F2.7.1">b</span>)</span> Line cut of panel a at <math alttext="V_{\mathrm{G}}=-0.472\ \text{V}" class="ltx_Math" display="inline" id="S2.F2.m8" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mo>−</mo><mrow><mn>0.472</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=-0.472\ \text{V}</annotation></semantics></math> (black dots) with marked conductance peaks separation <math alttext="2\Delta^{*}" class="ltx_Math" display="inline" id="S2.F2.m9" intent=":literal"><semantics><mrow><mn>2</mn><mo lspace="0em" rspace="0em">​</mo><msup><mi mathvariant="normal">Δ</mi><mo>∗</mo></msup></mrow><annotation encoding="application/x-tex">2\Delta^{*}</annotation></semantics></math>. <span class="ltx_text ltx_font_bold" id="S2.F2.8">(<span class="ltx_text" id="S2.F2.8.1">c</span>)</span> Differential resistance of the SQPC at <math alttext="V_{\mathrm{G}}=-0.6\ \text{V}" class="ltx_Math" display="inline" id="S2.F2.m10" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mo>−</mo><mrow><mn>0.6</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=-0.6\ \text{V}</annotation></semantics></math> as a function of source-drain voltage <math alttext="V_{\mathrm{SD}}" class="ltx_Math" display="inline" id="S2.F2.m11" intent=":literal"><semantics><msub><mi>V</mi><mi>SD</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{SD}}</annotation></semantics></math> and temperature <math alttext="T" class="ltx_Math" display="inline" id="S2.F2.m12" intent=":literal"><semantics><mi>T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math>. Each temperature curve is offset by <math alttext="200\penalty\ \Omega" class="ltx_Math" display="inline" id="S2.F2.m13" intent=":literal"><semantics><mrow><mn>200</mn><mo lspace="0.500em" rspace="0em">​</mo><mi mathvariant="normal">Ω</mi></mrow><annotation encoding="application/x-tex">200\penalty\ \Omega</annotation></semantics></math>. The peaks shifting with temperature indicated by arrows correspond to low-order MAR processes. <span class="ltx_text ltx_font_bold" id="S2.F2.9">(<span class="ltx_text" id="S2.F2.9.1">d</span>)</span> Evolution of the three MAR peaks as a function of the temperature and voltage drop <math alttext="V_{\mathrm{SD}}" class="ltx_Math" display="inline" id="S2.F2.m14" intent=":literal"><semantics><msub><mi>V</mi><mi>SD</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{SD}}</annotation></semantics></math>
across the QPC, plotted with fits to BCS theory (black lines).</figcaption>
</figure>
<figure class="ltx_figure" id="S2.F3"><img alt="Refer to caption" class="ltx_graphics ltx_centering ltx_img_landscape" height="272" id="S2.F3.g1" src="2611.16705v1/Fig3.png" style="aspect-ratio:476/272;" width="476"/>
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 3: </span>Current-phase relation of device A.
<span class="ltx_text ltx_font_bold" id="S2.F3.8">(<span class="ltx_text" id="S2.F3.8.1">a</span>)</span> Average switching current of the device in the SQUID configuration with the switching current of the reference junction subtracted. Markers on the left edge of the plot indicate the position of the line cuts in panel b. <span class="ltx_text ltx_font_bold" id="S2.F3.9">(<span class="ltx_text" id="S2.F3.9.1">b</span>)</span> Line cuts of panel a for different plunger gate voltages <math alttext="V_{\mathrm{G}}" class="ltx_Math" display="inline" id="S2.F3.m4" intent=":literal"><semantics><msub><mi>V</mi><mi>G</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{G}}</annotation></semantics></math> highlighting the amplitude quantization. The data is fitted assuming three modes with variable transmission. <span class="ltx_text ltx_font_bold" id="S2.F3.10">(<span class="ltx_text" id="S2.F3.10.1">c</span>)</span> Fitted amplitude of the SQUID oscillations as a function of plunger gate voltage <math alttext="V_{\mathrm{G}}" class="ltx_Math" display="inline" id="S2.F3.m5" intent=":literal"><semantics><msub><mi>V</mi><mi>G</mi></msub><annotation encoding="application/x-tex">V_{\mathrm{G}}</annotation></semantics></math>. <span class="ltx_text ltx_font_bold" id="S2.F3.11">(<span class="ltx_text" id="S2.F3.11.1">d</span>)</span> Fitted transmission of three individual modes. The assignment of transmission to each mode is determined by the maximum value.
<span class="ltx_text ltx_font_bold" id="S2.F3.12">(<span class="ltx_text" id="S2.F3.12.1">e</span>)</span> Temperature dependence of the CPR at <math alttext="V_{\mathrm{G}}=-0.65\ \text{V}" class="ltx_Math" display="inline" id="S2.F3.m6" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mo>−</mo><mrow><mn>0.65</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>V</mtext></mrow></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=-0.65\ \text{V}</annotation></semantics></math> (corresponding to the third conductance plateau of the QPC). <span class="ltx_text ltx_font_bold" id="S2.F3.13">(<span class="ltx_text" id="S2.F3.13.1">f</span>)</span> Extracted temperature dependence of the SQUID oscillation amplitude on each plateau.</figcaption>
</figure>
<figure class="ltx_figure" id="S2.F4"><img alt="Refer to caption" class="ltx_graphics ltx_centering ltx_img_landscape" height="250" id="S2.F4.g1" src="2611.16705v1/Fig4.png" style="aspect-ratio:476/250;" width="476"/>
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 4: </span>Microwave irradiation of individual JJs of device B.
<span class="ltx_text ltx_font_bold" id="S2.F4.7">(<span class="ltx_text" id="S2.F4.7.1">a</span>)</span> Differential resistance of the reference junction in dependence of DC-bias current and applied microwave power at <math alttext="f=2.25\ \text{GHz}" class="ltx_Math" display="inline" id="S2.F4.m8" intent=":literal"><semantics><mrow><mi>f</mi><mo>=</mo><mrow><mn>2.25</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>GHz</mtext></mrow></mrow><annotation encoding="application/x-tex">f=2.25\ \text{GHz}</annotation></semantics></math>. <span class="ltx_text ltx_font_bold" id="S2.F4.8">(<span class="ltx_text" id="S2.F4.8.1">b</span>)</span> DC voltage measured across the reference junction for various microwave powers. <span class="ltx_text ltx_font_bold" id="S2.F4.9">(<span class="ltx_text" id="S2.F4.9.1">c</span>)</span> Histogram of the measured DC voltage across the reference junction for various microwave powers. The integer multiples of <math alttext="hf/2e" class="ltx_Math" display="inline" id="S2.F4.m9" intent=":literal"><semantics><mrow><mrow><mrow><mi>h</mi><mo lspace="0em" rspace="0em">​</mo><mi>f</mi></mrow><mo>/</mo><mn>2</mn></mrow><mo lspace="0em" rspace="0em">​</mo><mi>e</mi></mrow><annotation encoding="application/x-tex">hf/2e</annotation></semantics></math> are highlighted by the blue arrows. The red arrows indicate the half integer steps. <span class="ltx_text ltx_font_bold" id="S2.F4.10">(<span class="ltx_text" id="S2.F4.10.1">d, f, h</span>)</span> Differential resistance of the SQPC as a function of DC-bias voltage in units of the superconducting gap and microwave power at fixed <math alttext="f=2.25\ \text{GHz}" class="ltx_Math" display="inline" id="S2.F4.m10" intent=":literal"><semantics><mrow><mi>f</mi><mo>=</mo><mrow><mn>2.25</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>GHz</mtext></mrow></mrow><annotation encoding="application/x-tex">f=2.25\ \text{GHz}</annotation></semantics></math> for gate voltages <math alttext="V_{\mathrm{G}}=-570\ \text{mV}" class="ltx_Math" display="inline" id="S2.F4.m11" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mo>−</mo><mrow><mn>570</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>mV</mtext></mrow></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=-570\ \text{mV}</annotation></semantics></math> (d), <math alttext="V_{\mathrm{G}}=-580\ \text{mV}" class="ltx_Math" display="inline" id="S2.F4.m12" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mo>−</mo><mrow><mn>580</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>mV</mtext></mrow></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=-580\ \text{mV}</annotation></semantics></math> (f) and <math alttext="V_{\mathrm{G}}=-650\ \text{mV}" class="ltx_Math" display="inline" id="S2.F4.m13" intent=":literal"><semantics><mrow><msub><mi>V</mi><mi>G</mi></msub><mo>=</mo><mrow><mo>−</mo><mrow><mn>650</mn><mo lspace="0.500em" rspace="0em">​</mo><mtext>mV</mtext></mrow></mrow></mrow><annotation encoding="application/x-tex">V_{\mathrm{G}}=-650\ \text{mV}</annotation></semantics></math> (h). The regions depicted in panels e, g, i are marked by the green boxes. <span class="ltx_text ltx_font_bold" id="S2.F4.11">(<span class="ltx_text" id="S2.F4.11.1">e, g, i</span>)</span> Zoom of panels d, f, h. The blue arrows indicate the integer multiples of <math alttext="hf/2e" class="ltx_Math" display="inline" id="S2.F4.m14" intent=":literal"><semantics><mrow><mrow><mrow><mi>h</mi><mo lspace="0em" rspace="0em">​</mo><mi>f</mi></mrow><mo>/</mo><mn>2</mn></mrow><mo lspace="0em" rspace="0em">​</mo><mi>e</mi></mrow><annotation encoding="application/x-tex">hf/2e</annotation></semantics></math>.</figcaption>
</figure>

<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 5: </span>CPR response to microwave irradiation.
