# Édition de nuit : classement + cartes, écrits dans Supabase.
#
# arXiv met ses flux à jour à minuit, heure de la côte Est (5 h UTC, ou 4 h UTC si arXiv suit
# l'heure d'été). Deux lancements couvrent les deux cas ; le pipeline ne refait jamais une
# édition déjà prête :
#   04:20 UTC  si le flux n'est pas encore à jour, ne rien faire (--stale wait)
#   05:20 UTC  dernier essai : flux à jour -> édition du jour ; sinon (week-end) -> réserve
# Les crons de GitHub peuvent partir avec plusieurs minutes de retard.

name: Édition de nuit

on:
  schedule:
    - cron: "20 4 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refaire l'édition même si elle est déjà prête"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      # Installation en mode éditable : le paquet lit config.yaml et prompts/ à la racine du dépôt.
      - run: pip install -e ./pipeline
      # Les figures choisies dans la journée par open-paper sont copiées ici (WebP, 1400 px au plus).
      - name: Copier les figures choisies à l'ouverture
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m arxiv_digest sync-figures
      - name: Construire l'édition
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STALE: ${{ github.event.schedule == '20 4 * * *' && 'wait' || 'reserve' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m arxiv_digest run --batch --stale "$STALE" $FORCE
