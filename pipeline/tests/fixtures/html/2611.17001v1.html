<figure class="ltx_figure" id="S0.F1"><img alt="Refer to caption" class="ltx_graphics ltx_img_landscape" height="125" id="S0.F1.g1" src="2611.17001v1/Fig1.png" style="aspect-ratio:476/125;" width="476"/>
<figcaption class="ltx_caption"><span class="ltx_tag ltx_tag_figure">Figure 1: </span>Reflectionless states of a Majorana wire. (a) InAs/Al wire between normal leads L and R. Tunnel gates set the couplings <math alttext="\gamma_{L}" class="ltx_Math" display="inline" id="S0.F1.m13" intent=":literal"><semantics><msub><mi>γ</mi><mi>L</mi></msub><annotation encoding="application/x-tex">\gamma_{L}</annotation></semantics></math> and <math alttext="\gamma_{R}" class="ltx_Math" display="inline" id="S0.F1.m14" intent=":literal"><semantics><msub><mi>γ</mi><mi>R</mi></msub><annotation encoding="application/x-tex">\gamma_{R}</annotation></semantics></math> of the Majorana end modes (computed densities in green and blue), which are split by <math alttext="\varepsilon" class="ltx_Math" display="inline" id="S0.F1.m15" intent=":literal"><semantics><mi>ε</mi><annotation encoding="application/x-tex">\varepsilon</annotation></semantics></math>. At a real reflection zero a wave sent from L (red) leaves through R without reflection. (b) Zeros (circles) and poles (crosses, <math alttext="\varepsilon=\gamma" class="ltx_Math" display="inline" id="S0.F1.m16" intent=":literal"><semantics><mrow><mi>ε</mi><mo>=</mo><mi>γ</mi></mrow><annotation encoding="application/x-tex">\varepsilon=\gamma</annotation></semantics></math>) of <math alttext="\det r_{L}(E)" class="ltx_Math" display="inline" id="S0.F1.m17" intent=":literal"><semantics><mrow><mo rspace="0.167em">det</mo><mrow><msub><mi>r</mi><mi>L</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mi>E</mi><mo stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\det r_{L}(E)</annotation></semantics></math> for <math alttext="\gamma_{L}=\gamma_{R}=\gamma" class="ltx_Math" display="inline" id="S0.F1.m18" intent=":literal"><semantics><mrow><msub><mi>γ</mi><mi>L</mi></msub><mo>=</mo><msub><mi>γ</mi><mi>R</mi></msub><mo>=</mo><mi>γ</mi></mrow><annotation encoding="application/x-tex">\gamma_{L}=\gamma_{R}=\gamma</annotation></semantics></math>. A real pair (<math alttext="\varepsilon=2\gamma" class="ltx_Math" display="inline" id="S0.F1.m19" intent=":literal"><semantics><mrow><mi>ε</mi><mo>=</mo><mrow><mn>2</mn><mo lspace="0em" rspace="0em">​</mo><mi>γ</mi></mrow></mrow><annotation encoding="application/x-tex">\varepsilon=2\gamma</annotation></semantics></math>, blue) coalesces at <math alttext="E=0" class="ltx_Math" display="inline" id="S0.F1.m20" intent=":literal"><semantics><mrow><mi>E</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">E=0</annotation></semantics></math> (<math alttext="\varepsilon=\gamma" class="ltx_Math" display="inline" id="S0.F1.m21" intent=":literal"><semantics><mrow><mi>ε</mi><mo>=</mo><mi>γ</mi></mrow><annotation encoding="application/x-tex">\varepsilon=\gamma</annotation></semantics></math>) and splits along the imaginary axis (<math alttext="\varepsilon=\gamma/2" class="ltx_Math" display="inline" id="S0.F1.m22" intent=":literal"><semantics><mrow><mi>ε</mi><mo>=</mo><mrow><mi>γ</mi><mo>/</mo><mn>2</mn></mrow></mrow><annotation encoding="application/x-tex">\varepsilon=\gamma/2</annotation></semantics></math>, red), which puts one zero in the lower half-plane (shaded), where <math alttext="Q=-1" class="ltx_Math" display="inline" id="S0.F1.m23" intent=":literal"><semantics><mrow><mi>Q</mi><mo>=</mo><mrow><mo>−</mo><mn>1</mn></mrow></mrow><annotation encoding="application/x-tex">Q=-1</annotation></semantics></math>. (c) Transmission of the Majorana channel for the same three values of <math alttext="\varepsilon" class="ltx_Math" display="inline" id="S0.F1.m24" intent=":literal"><semantics><mi>ε</mi><annotation encoding="application/x-tex">\varepsilon</annotation></semantics></math>.</figcaption>
</figure>
<figure class="ltx_figure" id="S0.F2"><img alt="Refer to caption" class="ltx_graphics ltx_img_landscape" height="175" id="S0.F2.g1" src="2611.17001v1/Fig2.png" style="aspect-ratio:476/175;" width="476"/>
<figcaption class="ltx_caption"><span class="ltx_tag ltx_tag_figure">Figure 2: </span>Sign changes of <math alttext="Q" class="ltx_Math" display="inline" id="S0.F2.m13" intent=":literal"><semantics><mi>Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math> for equal couplings. Reflection zeros nearest <math alttext="E=0" class="ltx_Math" display="inline" id="S0.F2.m14" intent=":literal"><semantics><mrow><mi>E</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">E=0</annotation></semantics></math> versus magnetic field in (a) the InAs/Al wire (1D, <math alttext="L=3~\mu" class="ltx_Math" display="inline" id="S0.F2.m15" intent=":literal"><semantics><mrow><mi>L</mi><mo>=</mo><mrow><mn>3</mn><mo lspace="0.330em" rspace="0em">​</mo><mi>μ</mi></mrow></mrow><annotation encoding="application/x-tex">L=3~\mu</annotation></semantics></math>m) and (b) the gate-defined device (2D): real zeros (blue), imaginary zeros (red), and both parts of complex quartets (pale). Dots mark coalescence fields, dashed lines the bulk critical field <math alttext="B_{c}" class="ltx_Math" display="inline" id="S0.F2.m16" intent=":literal"><semantics><msub><mi>B</mi><mi>c</mi></msub><annotation encoding="application/x-tex">B_{c}</annotation></semantics></math>, and the top strips <math alttext="Q" class="ltx_Math" display="inline" id="S0.F2.m17" intent=":literal"><semantics><mi>Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math> from the scattering matrix. (c) <math alttext="Q" class="ltx_Math" display="inline" id="S0.F2.m18" intent=":literal"><semantics><mi>Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math> of the wire versus field and length; triangles mark <math alttext="L=3" class="ltx_Math" display="inline" id="S0.F2.m19" intent=":literal"><semantics><mrow><mi>L</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">L=3</annotation></semantics></math> and <math alttext="6~\mu" class="ltx_Math" display="inline" id="S0.F2.m20" intent=":literal"><semantics><mrow><mn>6</mn><mo lspace="0.330em" rspace="0em">​</mo><mi>μ</mi></mrow><annotation encoding="application/x-tex">6~\mu</annotation></semantics></math>m. (d) Reflection <math alttext="1-T_{1}" class="ltx_Math" display="inline" id="S0.F2.m21" intent=":literal"><semantics><mrow><mn>1</mn><mo>−</mo><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">1-T_{1}</annotation></semantics></math> of the most transmitted channel at the first sign change <math alttext="B_{1}" class="ltx_Math" display="inline" id="S0.F2.m22" intent=":literal"><semantics><msub><mi>B</mi><mn>1</mn></msub><annotation encoding="application/x-tex">B_{1}</annotation></semantics></math> in the wire (dots) and in the 2D device (squares), and in the wire <math alttext="2" class="ltx_Math" display="inline" id="S0.F2.m23" intent=":literal"><semantics><mn>2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> mT below (blue) and above (red) <math alttext="B_{1}" class="ltx_Math" display="inline" id="S0.F2.m24" intent=":literal"><semantics><msub><mi>B</mi><mn>1</mn></msub><annotation encoding="application/x-tex">B_{1}</annotation></semantics></math>.</figcaption>
</figure>
<figure class="ltx_figure" id="S0.F3"><object class="ltx_graphics ltx_img_landscape" data="2611.17001v1/Fig3.svg" height="122" id="S0.F3.g1" style="aspect-ratio:476/122;" type="image/svg+xml" width="476"></object>
<figcaption class="ltx_caption"><span class="ltx_tag ltx_tag_figure">Figure 3: </span>(a) Unequal couplings separate the sign change of <math alttext="Q" class="ltx_Math" display="inline" id="S0.F3.m10" intent=":literal"><semantics><mi>Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>, at <math alttext="\varepsilon=(\gamma_{L}\gamma_{R})^{1/2}" class="ltx_Math" display="inline" id="S0.F3.m11" intent=":literal"><semantics><mrow><mi>ε</mi><mo>=</mo><msup><mrow><mo stretchy="false">(</mo><mrow><msub><mi>γ</mi><mi>L</mi></msub><mo lspace="0em" rspace="0em">​</mo><msub><mi>γ</mi><mi>R</mi></msub></mrow><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">\varepsilon=(\gamma_{L}\gamma_{R})^{1/2}</annotation></semantics></math> (solid), from the EP, at <math alttext="\varepsilon=(\gamma_{L}+\gamma_{R})/2" class="ltx_Math" display="inline" id="S0.F3.m12" intent=":literal"><semantics><mrow><mi>ε</mi><mo>=</mo><mrow><mrow><mo stretchy="false">(</mo><mrow><msub><mi>γ</mi><mi>L</mi></msub><mo>+</mo><msub><mi>γ</mi><mi>R</mi></msub></mrow><mo stretchy="false">)</mo></mrow><mo>/</mo><mn>2</mn></mrow></mrow><annotation encoding="application/x-tex">\varepsilon=(\gamma_{L}+\gamma_{R})/2</annotation></semantics></math> (dashed). Symbols show the wire (squares), the 2D device (circles), and disordered wires (diamonds) at their sign-change fields (filled) and coalescence fields (open). (b) Local conductance of the wire at zero temperature for <math alttext="\varepsilon/\gamma=0.4" class="ltx_Math" display="inline" id="S0.F3.m13" intent=":literal"><semantics><mrow><mrow><mi>ε</mi><mo>/</mo><mi>γ</mi></mrow><mo>=</mo><mn>0.4</mn></mrow><annotation encoding="application/x-tex">\varepsilon/\gamma=0.4</annotation></semantics></math>, <math alttext="3^{-1/2}" class="ltx_math_unparsed" display="inline" id="S0.F3.m14" intent=":literal"><semantics><mrow><mn>3</mn><msup><mrow></mrow><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">3^{-1/2}</annotation></semantics></math>, <math alttext="1" class="ltx_Math" display="inline" id="S0.F3.m15" intent=":literal"><semantics><mn>1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, and <math alttext="1.3" class="ltx_Math" display="inline" id="S0.F3.m16" intent=":literal"><semantics><mn>1.3</mn><annotation encoding="application/x-tex">1.3</annotation></semantics></math> from the scattering matrix (symbols) and from the two-mode form of Eq. (<a class="ltx_ref" href="#S0.E5" title="In Reflection Zeros Set the Scattering Invariant of Finite Majorana Wires"><span class="ltx_text ltx_ref_tag">5</span></a>) (lines). (c) Zero-bias conductance of a two-site Kitaev chain with the model parameters of Ref. <cite class="ltx_cite ltx_citemacro_cite">[<a class="ltx_ref" href="#bib.bib21" title="">21</a>]</cite> at 0, 5, 20, and 45 mK. The diamond shows the measured peak heights <cite class="ltx_cite ltx_citemacro_cite">[<a class="ltx_ref" href="#bib.bib21" title="">21</a>]</cite>. Red shading marks <math alttext="Q=-1" class="ltx_Math" display="inline" id="S0.F3.m17" intent=":literal"><semantics><mrow><mi>Q</mi><mo>=</mo><mrow><mo>−</mo><mn>1</mn></mrow></mrow><annotation encoding="application/x-tex">Q=-1</annotation></semantics></math>, and dotted lines mark <math alttext="e^{2}/h" class="ltx_Math" display="inline" id="S0.F3.m18" intent=":literal"><semantics><mrow><msup><mi>e</mi><mn>2</mn></msup><mo>/</mo><mi>h</mi></mrow><annotation encoding="application/x-tex">e^{2}/h</annotation></semantics></math>.</figcaption>
</figure>
