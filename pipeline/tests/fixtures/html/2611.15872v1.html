<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure"><span class="ltx_text" id="S2.F1.3" style="font-size:90%;">Figure 1</span>: </span><span class="ltx_text" id="S2.F1.4" style="font-size:90%;">

</span></figcaption>
