[project]
name = "arxiv-digest"
version = "0.1.0"
description = "Pipeline quotidien : arXiv -> édition d'articles de physique expliqués et vérifiés"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.80",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
    "pypdf>=4",
    "python-dotenv>=1",
    "pillow>=10",
    "pymupdf>=1.24",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arxiv_digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
