# Notifications : une le matin (édition prête), un rappel le soir si l'édition n'est pas terminée.
#
# Les heures se règlent dans l'app (écran Profil ; par défaut 7 h 30 et 20 h, Europe/Zurich).
# GitHub ne connaît que l'heure UTC : un créneau par heure couvre les plages réglables, été comme
# hiver, et la commande n'envoie que si l'heure locale réglée est atteinte et que rien n'a déjà été
# envoyé ce jour-là. Une notification part donc au premier créneau après l'heure réglée.
#   matin  04:35 à 08:35 UTC  ->  réglable de 6 h à 10 h
#   soir   15:05 à 20:05 UTC  ->  réglable de 17 h à 22 h

name: Notifications

on:
  schedule:
    - cron: "35 4-8 * * *"
    - cron: "5 15-20 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Notification à évaluer"
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ./pipeline
      - name: Envoyer la notification si elle est due
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIND: ${{ inputs.kind || (startsWith(github.event.schedule, '35 ') && 'morning' || 'evening') }}
        run: python -m arxiv_digest notify "$KIND"
