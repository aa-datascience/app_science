<figure class="ltx_figure" id="S0.F1"><object class="ltx_graphics ltx_centering ltx_img_landscape" data="2611.14637v1/phase_diagram_nice.svg" height="289" id="S0.F1.g1" style="aspect-ratio:476/289;" type="image/svg+xml" width="476"></object>
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 1: </span>Mobility <math alttext="\mu_{\alpha}(2i\pi/\beta)" class="ltx_Math" display="inline" id="S0.F1.m16" intent=":literal"><semantics><mrow><msub><mi>μ</mi><mi>α</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mrow><mrow><mn>2</mn><mo lspace="0em" rspace="0em">​</mo><mi>i</mi><mo lspace="0em" rspace="0em">​</mo><mi>π</mi></mrow><mo>/</mo><mi>β</mi></mrow><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mu_{\alpha}(2i\pi/\beta)</annotation></semantics></math> as a function of <math alttext="\alpha" class="ltx_Math" display="inline" id="S0.F1.m17" intent=":literal"><semantics><mi>α</mi><annotation encoding="application/x-tex">\alpha</annotation></semantics></math> at <math alttext="r=1.5" class="ltx_Math" display="inline" id="S0.F1.m18" intent=":literal"><semantics><mrow><mi>r</mi><mo>=</mo><mn>1.5</mn></mrow><annotation encoding="application/x-tex">r=1.5</annotation></semantics></math> and <math alttext="\beta=64,256,1024,4096,16384,65536" class="ltx_Math" display="inline" id="S0.F1.m19" intent=":literal"><semantics><mrow><mrow><mi>β</mi><mo>=</mo><mn>64,256</mn></mrow><mo>,</mo><mn>1024</mn><mo>,</mo><mn>4096</mn><mo>,</mo><mn>16384</mn><mo>,</mo><mn>65536</mn></mrow><annotation encoding="application/x-tex">\beta=64,256,1024,4096,16384,65536</annotation></semantics></math> (from light to dark blue). Error bars are smaller than the symbols. When the temperature is decreased, <math alttext="\mu_{\alpha}" class="ltx_Math" display="inline" id="S0.F1.m20" intent=":literal"><semantics><msub><mi>μ</mi><mi>α</mi></msub><annotation encoding="application/x-tex">\mu_{\alpha}</annotation></semantics></math> converges to <math alttext="\mu^{\star}=1" class="ltx_Math" display="inline" id="S0.F1.m21" intent=":literal"><semantics><mrow><msup><mi>μ</mi><mo>⋆</mo></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\mu^{\star}=1</annotation></semantics></math> for <math alttext="\alpha&lt;1" class="ltx_Math" display="inline" id="S0.F1.m22" intent=":literal"><semantics><mrow><mi>α</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\alpha&lt;1</annotation></semantics></math> and to <math alttext="\mu^{\star}=0" class="ltx_Math" display="inline" id="S0.F1.m23" intent=":literal"><semantics><mrow><msup><mi>μ</mi><mo>⋆</mo></msup><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mu^{\star}=0</annotation></semantics></math> for <math alttext="\alpha&gt;1" class="ltx_Math" display="inline" id="S0.F1.m24" intent=":literal"><semantics><mrow><mi>α</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\alpha&gt;1</annotation></semantics></math>. At <math alttext="\alpha=1" class="ltx_Math" display="inline" id="S0.F1.m25" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\alpha=1</annotation></semantics></math>, it takes an intermediate value that depends on <math alttext="r" class="ltx_Math" display="inline" id="S0.F1.m26" intent=":literal"><semantics><mi>r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math>. The dashed line indicates this expected result in the limit <math alttext="\beta\to\infty" class="ltx_Math" display="inline" id="S0.F1.m27" intent=":literal"><semantics><mrow><mi>β</mi><mo stretchy="false">→</mo><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\beta\to\infty</annotation></semantics></math>. Typical field configurations of the SOS model (<a class="ltx_ref" href="#S0.E2" title="In Model and phase diagram — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">2</span></a>) at <math alttext="\beta=128" class="ltx_Math" display="inline" id="S0.F1.m28" intent=":literal"><semantics><mrow><mi>β</mi><mo>=</mo><mn>128</mn></mrow><annotation encoding="application/x-tex">\beta=128</annotation></semantics></math> are displayed on the left inset for <math alttext="\alpha=2/3" class="ltx_Math" display="inline" id="S0.F1.m29" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></mrow><annotation encoding="application/x-tex">\alpha=2/3</annotation></semantics></math> and on the right inset for <math alttext="\alpha=3/2" class="ltx_Math" display="inline" id="S0.F1.m30" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></mrow><annotation encoding="application/x-tex">\alpha=3/2</annotation></semantics></math>.
</figcaption>
</figure>
<figure class="ltx_figure" id="S0.F2">
<div class="ltx_flex_figure">

<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 2: </span>(a): Mobility of the SOS model for <math alttext="\alpha=1/2" class="ltx_Math" display="inline" id="S0.F2.m11" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></mrow><annotation encoding="application/x-tex">\alpha=1/2</annotation></semantics></math> and for various values of <math alttext="r" class="ltx_Math" display="inline" id="S0.F2.m12" intent=":literal"><semantics><mi>r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> in terms of the rescaled frequency. The dashed black line corresponds to <math alttext="1-\mathcal{G}^{\rm EK}_{2}" class="ltx_Math" display="inline" id="S0.F2.m13" intent=":literal"><semantics><mrow><mn>1</mn><mo>−</mo><msubsup><mi class="ltx_font_mathcaligraphic">𝒢</mi><mn>2</mn><mi>EK</mi></msubsup></mrow><annotation encoding="application/x-tex">1-\mathcal{G}^{\rm EK}_{2}</annotation></semantics></math>. (b): Mobility of the SOS model for <math alttext="\alpha=2" class="ltx_Math" display="inline" id="S0.F2.m14" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">\alpha=2</annotation></semantics></math>. The black dashed line corresponds to the Emery-Kivelson solution (<a class="ltx_ref" href="#S0.E9" title="In Duality 𝛼↔1/𝛼 — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">9</span></a>). The deviations from the exact result at high-frequency (<math alttext="\omega_{n}\simeq 1" class="ltx_Math" display="inline" id="S0.F2.m15" intent=":literal"><semantics><mrow><msub><mi>ω</mi><mi>n</mi></msub><mo>≃</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\omega_{n}\simeq 1</annotation></semantics></math>) are non-universal effects. (c): Mobility of the SOS model for <math alttext="\alpha=2/3" class="ltx_Math" display="inline" id="S0.F2.m16" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></mrow><annotation encoding="application/x-tex">\alpha=2/3</annotation></semantics></math>. (d): Mobility of the SOS model for <math alttext="\alpha=3/2" class="ltx_Math" display="inline" id="S0.F2.m17" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></mrow><annotation encoding="application/x-tex">\alpha=3/2</annotation></semantics></math>. The black dashed line corresponds to <math alttext="1-\mathcal{G}_{2/3}" class="ltx_Math" display="inline" id="S0.F2.m18" intent=":literal"><semantics><mrow><mn>1</mn><mo>−</mo><msub><mi class="ltx_font_mathcaligraphic">𝒢</mi><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></msub></mrow><annotation encoding="application/x-tex">1-\mathcal{G}_{2/3}</annotation></semantics></math> where <math alttext="\mathcal{G}_{2/3}" class="ltx_Math" display="inline" id="S0.F2.m19" intent=":literal"><semantics><msub><mi class="ltx_font_mathcaligraphic">𝒢</mi><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></msub><annotation encoding="application/x-tex">\mathcal{G}_{2/3}</annotation></semantics></math> is the universal mobility crossover at <math alttext="\alpha=2/3" class="ltx_Math" display="inline" id="S0.F2.m20" intent=":literal"><semantics><mrow><mi>α</mi><mo>=</mo><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></mrow><annotation encoding="application/x-tex">\alpha=2/3</annotation></semantics></math> extracted from (c).</figcaption>
</figure>
<figure class="ltx_figure" id="S0.F3">

<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 3: </span>(a) Mobility <math alttext="\mu^{\star}_{\alpha=1}" class="ltx_Math" display="inline" id="S0.F3.m8" intent=":literal"><semantics><msubsup><mi>μ</mi><mrow><mi>α</mi><mo>=</mo><mn>1</mn></mrow><mo>⋆</mo></msubsup><annotation encoding="application/x-tex">\mu^{\star}_{\alpha=1}</annotation></semantics></math> as a function of <math alttext="r" class="ltx_Math" display="inline" id="S0.F3.m9" intent=":literal"><semantics><mi>r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> at <math alttext="\beta=8192" class="ltx_Math" display="inline" id="S0.F3.m10" intent=":literal"><semantics><mrow><mi>β</mi><mo>=</mo><mn>8192</mn></mrow><annotation encoding="application/x-tex">\beta=8192</annotation></semantics></math>. The dotted line is a guide to the eye. (b) Mobility <math alttext="\mu^{\star}_{\alpha=1}" class="ltx_Math" display="inline" id="S0.F3.m11" intent=":literal"><semantics><msubsup><mi>μ</mi><mrow><mi>α</mi><mo>=</mo><mn>1</mn></mrow><mo>⋆</mo></msubsup><annotation encoding="application/x-tex">\mu^{\star}_{\alpha=1}</annotation></semantics></math> as a function of <math alttext="\eta_{q}" class="ltx_Math" display="inline" id="S0.F3.m12" intent=":literal"><semantics><msub><mi>η</mi><mi>q</mi></msub><annotation encoding="application/x-tex">\eta_{q}</annotation></semantics></math> for <math alttext="q=0.2,0.3,0.4" class="ltx_Math" display="inline" id="S0.F3.m13" intent=":literal"><semantics><mrow><mrow><mi>q</mi><mo>=</mo><mn>0.2</mn></mrow><mo>,</mo><mn>0.3</mn><mo>,</mo><mn>0.4</mn></mrow><annotation encoding="application/x-tex">q=0.2,0.3,0.4</annotation></semantics></math>. The Monte Carlo data (blue squares) was obtained for <math alttext="\beta=8192" class="ltx_Math" display="inline" id="S0.F3.m14" intent=":literal"><semantics><mrow><mi>β</mi><mo>=</mo><mn>8192</mn></mrow><annotation encoding="application/x-tex">\beta=8192</annotation></semantics></math>. The dashed lines indicate the exact result (<a class="ltx_ref" href="#S0.E12" title="In Vertical line of fixed point — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">12</span></a>). Error bars are smaller than the symbols. The agreement is excellent despite the finite temperature.</figcaption>
</figure>
<figure class="ltx_figure" id="S0.F4"><object class="ltx_graphics ltx_centering ltx_img_landscape" data="2611.14637v1/RG_flows.svg" height="259" id="S0.F4.g1" style="aspect-ratio:476/259;" type="image/svg+xml" width="476"></object>
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure">Figure 4: </span>(a): Flow diagram of the BKT transition corresponding to Eqs. (<a class="ltx_ref" href="#S0.E13" title="In Similarities and differences between Schmid and BKT transitions — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">13</span></a>,<a class="ltx_ref" href="#S0.E14" title="In Similarities and differences between Schmid and BKT transitions — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">14</span></a>). (b): Flow diagram of the Schmid transition corresponding to Eqs. (<a class="ltx_ref" href="#S0.E15" title="In Similarities and differences between Schmid and BKT transitions — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">15</span></a>,<a class="ltx_ref" href="#S0.E16" title="In Similarities and differences between Schmid and BKT transitions — ‣ A discrete realization of the boundary sine-Gordon model and the Schmid transition"><span class="ltx_text ltx_ref_tag">16</span></a>). Fixed points are in blue.</figcaption>
</figure>
